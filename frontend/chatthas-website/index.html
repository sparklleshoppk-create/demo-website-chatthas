<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1A1A1A" />
    <title>Chattha's — Authentic Pakistani Desi Food | Islamabad & Rawalpindi</title>
    <meta name="description" content="Chattha's serves authentic Pakistani cuisine cooked in organic desi ghee — from Halwa Puri to Karahi, Biryani to Nihari. 4 branches in Islamabad & Bahria. Order now on Foodpanda or visit us." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,300;1,400&family=Lato:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loader" style="position:fixed;inset:0;background:#0A0A0A;z-index:99999;display:flex;align-items:center;justify-content:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:22px;">
          <!-- Top Bar -->
          <div style="width:clamp(360px,32vw,500px);height:2px;background:linear-gradient(90deg,transparent 0%,#C9A84C 15%,#efdba3 50%,#C9A84C 85%,transparent 100%);transform:scaleX(0);animation:barExpand 1s cubic-bezier(0.22,1,0.36,1) 0.2s forwards;"></div>
          
          <!-- Pre-Logo Tagline (Above Logo) -->
          <p style="font-family:'Lato',sans-serif;font-size:0.7rem;letter-spacing:0.4em;text-transform:uppercase;color:#C9A84C;margin:0;padding-left:0.4em;opacity:0;animation:fadePreSlogan 0.8s ease-out 0.5s forwards;">Authentic Pakistani Cuisine</p>
          
          <!-- Brand Name -->
          <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(2.5rem,6vw,5rem);font-weight:700;margin:0;padding-left:0.15em;background:linear-gradient(135deg,#C9A84C,#efdba3,#C9A84C);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:trackIn 1.2s cubic-bezier(0.22,1,0.36,1) 0.7s both;opacity:0;">Chattha's</h1>
          
          <!-- Slogan -->
          <p style="font-family:'Lato',sans-serif;font-size:0.7rem;letter-spacing:0.35em;text-transform:uppercase;color:rgba(250,247,240,0.5);margin:0;padding-left:0.35em;opacity:0;animation:fadeSlogan 0.8s ease-out 1.1s forwards;">Making Desi Food Great Again</p>
          
          <!-- Bottom Bar -->
          <div style="width:clamp(360px,32vw,500px);height:2px;background:linear-gradient(90deg,transparent 0%,#C9A84C 15%,#efdba3 50%,#C9A84C 85%,transparent 100%);transform:scaleX(0);animation:barExpand 1s cubic-bezier(0.22,1,0.36,1) 0.9s forwards;"></div>
        </div>
        
        <style>
          @keyframes barExpand {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
          }
          @keyframes fadePreSlogan {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @keyframes trackIn {
            from { opacity: 0; letter-spacing: 0.6em; }
            to { opacity: 1; letter-spacing: 0.15em; }
          }
          @keyframes fadeSlogan {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
